    '<label class="lbl" for="f-motor">Model motor</label><input class="inp" id="f-motor" data-f="motor" list="dl-motor" placeholder="Vario, Beat, NMAX…" autocomplete="off" value="' + esc(f.motor) + '">' +
    '<datalist id="dl-motor">' + S.init.kategori.map(function(k){ return '<option value="' + esc(k['Model']) + '">'; }).join('') + '</datalist>' +

    (f.showCust ? '<div class="row"><div><label class="lbl">Nama</label><input class="inp" data-f="nama" value="' + esc(f.nama) + '" placeholder="Nama pelanggan"></div><div><label class="lbl">No WA</label><input class="inp" data-f="wa" inputmode="tel" value="' + esc(f.wa) + '" placeholder="08…"></div></div>' : '') +
    '</section>';

    (f.susulan ? '<div class="susulan-box"><div class="row"><div><label class="lbl" for="f-tgl">Tanggal datang</label><input class="inp" type="date" id="f-tgl" data-f="tanggal" min="' + susulanMin() + '" max="' + esc(S.init.today) + '" value="' + esc(f.tanggal) + '"></div>' +
      '<div><label class="lbl" for="f-jam">Jam datang</label><input class="inp" type="time" id="f-jam" data-f="jam" value="' + esc(f.jam) + '"></div></div>' +
      '<p>Dicatat di tanggal itu: laporan harian, upah, uang makan, dan nomor nota ikut tanggal tersebut. Status cuci otomatis selesai.</p></div>' : '') +
    '</section>';
  html += '<section class="card span2"><div class="card-t"><h2>Layanan</h2><small id="kat-note"></small></div><div class="tiles" id="paket-seg"></div>' +

    '<button class="link" data-act="toggleDiskon">' + (f.showDiskon ? 'Hapus diskon' : '+ Beri diskon') + '</button>' +
    (f.showDiskon ? '<div class="row"><div><label class="lbl">Diskon</label><input class="inp" data-f="diskon" inputmode="numeric" placeholder="Rp" value="' + esc(f.diskon ? R(f.diskon) : '') + '"></div><div><label class="lbl">Alasan</label><input class="inp" data-f="alasanDiskon" value="' + esc(f.alasanDiskon) + '" placeholder="mis. langganan"></div></div>' : '') +
    '</section></div>';
  html += '<div class="right"><section class="card order"><div class="card-t"><h2>Nota</h2><small id="order-plat"></small></div><div id="order-lines"></div>' +
    '<div class="tot"><small id="order-save">Total</small><span class="num js-total">Rp0</span></div></section>' +
    '<section class="card"><div class="card-t"><h2>Pembayaran</h2></div><div class="seg2" id="bayar-seg"></div><div id="metode-box"></div>' +
    '<div class="desk-only"><button class="btn go big full js-save" style="margin-top:14px" data-act="simpan">Simpan</button><div class="hint js-hint"></div></div></section></div></div>';
  $('#main').innerHTML = html;
  $('#paybar-slot').innerHTML = '<div class="paybar"><div class="t"><small class="js-totlabel">Total</small><span class="num js-total">Rp0</span><div class="hint js-hint"></div></div><button class="btn go big js-save" data-act="simpan">Simpan</button></div>';
  refreshKasir();

function chipsHtml(opts, cur, act){
  return opts.map(function(o){ return '<button class="chip' + (o.v === cur ? ' on' : '') + '" data-act="' + act + '" data-v="' + esc(o.v) + '">' + esc(o.t) + '</button>'; }).join('');
}
function optsHtml(opts, cur, act){
  return opts.map(function(o){ return '<button class="opt' + (o.v === cur ? ' on' : '') + '" data-act="' + act + '" data-v="' + esc(o.v) + '">' + (o.i || '') + esc(o.t) + (o.s ? '<small>' + esc(o.s) + '</small>' : '') + '</button>'; }).join('');
}
function refreshKasir(){
  var f = S.f, kat = f.kategori;
  $('#kat-seg').innerHTML = chipsHtml(['Kecil','Sedang','Besar'].map(function(k){ return { v:k, t:k }; }), kat, 'setKat');
  $('#kat-note').textContent = kat ? 'Harga motor ' + kat.toLowerCase() : 'Pilih ukuran motor untuk melihat harga';
  var tiles = hargaBy('Paket').map(function(h){
    var on = f.paket === h['Kode'];
    return '<button class="tile' + (on ? ' on' : '') + '" data-act="setPaket" data-v="' + esc(h['Kode']) + '">' + (/prem/i.test(h['Layanan']) ? I.spark : I.drop) +
      '<b>' + esc(h['Layanan'].replace(/^Cuci /, '')) + '</b>' + (kat ? '<span class="pr">' + rp(h['Harga ' + kat]) + '</span>' : '<span class="pr mut">pilih ukuran</span>') + '</button>';
  }).join('');
  tiles += '<button class="tile' + (!f.paket ? ' on' : '') + '" data-act="setPaket" data-v="">' + I.helm + '<b>Tanpa cuci motor</b><span class="pr mut">helm / lainnya saja</span></button>';
  $('#paket-seg').innerHTML = tiles;
  var tb = '';
  var tam = hargaBy('Tambahan');
  if (tam.length) {
    tb += '<label class="lbl">Tambahan</label><div class="addons">';
    tam.forEach(function(h){
      var on = f.items[h['Kode']] > 0;
      tb += '<button class="addon' + (on ? ' on' : '') + '" data-act="toggleItem" data-k="' + esc(h['Kode']) + '"><span class="tick"></span><span class="nm">' + esc(h['Layanan']) + '</span><span class="pr">' + (kat ? '+' + R(h['Harga ' + kat]) : '') + '</span></button>';
    });
    tb += '</div>';
  }
  var lain = hargaBy('Lainnya');
  if (lain.length) {
    tb += '<label class="lbl">Layanan lain</label>';
    lain.forEach(function(h){
      var q = f.items[h['Kode']] || 0;
      tb += '<div class="addon' + (q ? ' on' : '') + '" style="cursor:default"><span class="nm">' + esc(h['Layanan']) + '<small>' + rp(h['Harga Kecil']) + ' per item</small></span><span class="stepper"><button data-act="qty" data-k="' + esc(h['Kode']) + '" data-d="-1" aria-label="Kurangi">−</button><b>' + q + '</b><button data-act="qty" data-k="' + esc(h['Kode']) + '" data-d="1" aria-label="Tambah">+</button></span></div>';
    });
  }
  $('#tambahan-box').innerHTML = tb;
  var pc = S.init.pencuci.map(function(n){ return { v:n, t:n }; });
  pc.push({ v:'', t:'Pilih nanti' });
  $('#pencuci-seg').innerHTML = chipsHtml(pc, f.pencuci, 'setPencuci');
  if (f.susulan) $('#status-seg').innerHTML = '<div class="muted" style="font-size:13.5px">Otomatis selesai, karena motornya sudah dicuci.</div>';
  else $('#status-seg').innerHTML = optsHtml([{ v:'Menunggu', t:'Masuk antrean', s:'belum dicuci' }, { v:'Selesai', t:'Sudah selesai', s:'langsung selesai' }], f.statusCuci, 'setStatus');
  $('#bayar-seg').innerHTML = optsHtml([{ v:'nanti', t:'Bayar nanti', s:'setelah dicuci' }, { v:'sekarang', t:'Bayar sekarang', s:'tunai atau QRIS' }], f.bayarSekarang ? 'sekarang' : 'nanti', 'setBayar');
  var mb = '';
  if (f.bayarSekarang) {
    mb += '<div class="seg2" style="margin-top:10px">' + optsHtml([{ v:'Tunai', t:'Tunai' }, { v:'QRIS', t:'QRIS' }], f.metode, 'setMetode') + '</div>';
    if (f.metode === 'Tunai') {
      mb += '<label class="lbl" for="f-diterima">Uang diterima</label><input class="inp money" id="f-diterima" data-f="diterima" inputmode="numeric" placeholder="Rp0" value="' + esc(f.diterima ? R(f.diterima) : '') + '">' +
        '<div class="chips" style="margin-top:8px" id="quick-cash"></div><div id="kembali"></div>';
    }
  }
  $('#metode-box').innerHTML = mb;
  updateTotals();
}
function updateTotals(){
  var r = calc(), f = S.f;
  var total = r.ok ? r.c.total : 0;
  $$('.js-total').forEach(function(e){ e.textContent = rp(total); });
  var err = '';
  if (!r.ok) err = r.msg;
  else if (!f.paket && !Object.keys(f.items).some(function(k){ return f.items[k] > 0; })) err = 'Pilih layanan';
  else if (f.paket && !KASIRAPP.normPlat(f.plat)) err = 'Isi plat nomor';
  else if (f.susulan && (!f.tanggal || !f.jam)) err = 'Isi tanggal dan jam datang';
  else if (f.susulan && f.tanggal > S.init.today) err = 'Tanggal tidak boleh setelah hari ini';
  else if (f.susulan && f.paket && !f.pencuci) err = 'Pilih pencuci';
  var hemat = r.ok ? r.c.diskon : 0;
  $$('.js-totlabel').forEach(function(e){ e.textContent = hemat ? 'Total, hemat ' + rp(hemat) : 'Total'; });
  // baris nota
  var ol = $('#order-lines');
  if (ol) {
    var h = '';
    if (r.ok && r.c.lines.length) {
      r.c.lines.forEach(function(l){ h += '<div class="ln"><span>' + (l.qty > 1 ? l.qty + '× ' : '') + esc(l.nama) + '</span><span>' + R(l.sub) + '</span></div>'; });
      if (r.c.diskon) h += '<div class="ln minus"><span>Diskon</span><span>−' + R(r.c.diskon) + '</span></div>';
    } else h = '<div class="empty-ln">Pilih ukuran motor dan layanan.</div>';
    ol.innerHTML = h;
    var op = $('#order-plat'); if (op) op.innerHTML = KASIRAPP.normPlat(f.plat) ? '<span class="plate" style="font-size:13px;padding:1px 7px">' + esc(KASIRAPP.normPlat(f.plat)) + '</span>' : '';
    var os = $('#order-save'); if (os) os.textContent = hemat ? 'Total (hemat ' + rp(hemat) + ')' : 'Total';
  }
  if (f.bayarSekarang && f.metode === 'Tunai' && r.ok) {
    var qc = $('#quick-cash');
    if (qc) {
      var opts = [total].concat([20000, 50000, 100000].filter(function(v){ return v > total; })).slice(0, 4);
      qc.innerHTML = opts.map(function(v, i){ return '<button class="chip" data-act="quickCash" data-v="' + v + '">' + (i === 0 ? 'Uang pas' : R(v)) + '</button>'; }).join('');
    }
    var d = Number(String(f.diterima).replace(/\D/g, '')) || 0;
    var kb = $('#kembali');
    if (kb) kb.innerHTML = d ? (d >= total ? '<div class="change"><span>Kembalian</span><span class="num">' + rp(d - total) + '</span></div>' : '<div class="change short"><span>Uang kurang</span><span class="num">' + rp(total - d) + '</span></div>') : '';
    if (d < total && !err) err = 'Isi uang diterima';
  }
  $$('.js-hint').forEach(function(e){ e.textContent = err; });
  $$('.js-save').forEach(function(b){ b.disabled = !!err; b.innerHTML = I.check + (f.susulan ? 'Simpan susulan' : (f.bayarSekarang ? 'Simpan & bayar' : 'Simpan ke antrean')); });
}
function renderPel(){
  var box = $('#pel-box'); if (!box) return;
  var p = S.pel, f = S.f;
  if (!KASIRAPP.normPlat(f.plat)) { box.innerHTML = ''; return; }
  if (S.pelPlat !== KASIRAPP.normPlat(f.plat)) { box.innerHTML = '<div class="cust"><div class="who"><small>Mencari pelanggan…</small></div></div>'; return; }
  if (!p) { box.innerHTML = '<div class="cust"><div class="who"><b>Pelanggan baru</b><small>Cucian pertama di sini</small></div></div>'; return; }
  box.innerHTML = '<div class="cust"><div class="who"><b>' + esc(p.nama || 'Pelanggan lama') + '</b><small>' + (p.motor ? esc(p.motor) + ', ' : '') + 'sudah cuci ' + p.totalCuci + ' kali. Ini cucian ke-' + (p.totalCuci + 1) + '.</small></div></div>';
}
var platTimer;
function onPlat(){
  clearTimeout(platTimer);
  var plat = KASIRAPP.normPlat(S.f.plat);
  S.pel = null; S.pelPlat = ''; renderPel(); updateTotals();
  if (!plat || plat.length < 3) return;
  platTimer = setTimeout(function(){
    api('cariPelanggan', plat).then(function(p){
      if (KASIRAPP.normPlat(S.f.plat) !== plat) return;
      S.pel = p; S.pelPlat = plat;
      if (p) {

  }, function(e){ done(null, e && e.message); });

      f.susulan = !f.susulan;
      if (f.susulan) { if (!f.tanggal) f.tanggal = kemarin(); if (!f.jam) f.jam = '10:00'; f.bayarSekarang = true; }
      renderKasir(); break;
    case 'setPencuci': f.pencuci = el.dataset.v; refreshKasir(); break;
    case 'setStatus': f.statusCuci = el.dataset.v; refreshKasir(); break;
    case 'setBayar': f.bayarSekarang = el.dataset.v === 'sekarang'; refreshKasir(); break;
    case 'setMetode': f.metode = el.dataset.v; refreshKasir(); break;
    case 'quickCash': f.diterima = Number(el.dataset.v); var di = $('#f-diterima'); if (di) di.value = R(f.diterima); updateTotals(); break;
    case 'simpan': simpan(); break;
    case 'closeModal': closeModal(); break;
    case 'print': if (IS_GAS) printStruk(S.lastNota); else toast('Di versi asli, struk langsung dicetak ke printer thermal 58 mm.'); break;
    case 'nota': openNota(el.dataset.n); break;
    case 'openBayar': openBayar(S.lastNota); break;
    case 'bayarNota': call('getNota', el.dataset.n).then(openBayar).catch(function(){}); break;
    case 'payMetode': PAY.st.metode = el.dataset.v; PAY.draw(); break;
    case 'payQuick': PAY.st.d = el.dataset.v; PAY.draw(); break;
    case 'payOk': payOk(); break;
    case 'openBatal': openBatal(el.dataset.n); break;
    case 'batalOk': call('batal', el.dataset.n, $('#batal-alasan').value).then(function(n){ toast('Nota dibatalkan'); showStruk(n); refreshTab(); }).catch(function(){}); break;
    case 'reloadAntre': loadAntre(); break;
    case 'mulai': call('updateStatusCuci', el.dataset.n, 'Dicuci', el.dataset.p).then(function(){ loadAntre(true); }).catch(function(){}); break;
    case 'selesai': call('updateStatusCuci', el.dataset.n, 'Selesai', '').then(function(){ toast('Selesai dicuci'); loadAntre(true); }).catch(function(){}); break;
    case 'addPeng':
      call('tambahPengeluaran', { pos:$('#pg-pos').value, jumlah:digits($('#pg-jml').value), dariLaci:$('#pg-laci').checked })
        .then(function(r){ S.hari = r; renderHari(); toast('Pengeluaran dicatat'); }).catch(function(){}); break;
    case 'tutupKas':
      call('tutupKas', { modal:digits($('#tk-modal').value), dihitung:digits($('#tk-hitung').value), catatan:$('#tk-cat').value })
        .then(function(r){ S.hari = r; renderHari(); toast('Kas ditutup'); }).catch(function(){}); break;
    case 'stokMasuk':
      call('stokMasuk', { kode:$('#sm-kode').value, jumlah:digits($('#sm-jml').value), totalHarga:digits($('#sm-harga').value), dariLaci:$('#sm-laci').checked })
        .then(function(r){ S.stok = r; renderStok(); toast('Stok ditambah'); api('init').then(function(i){ S.init = i; }); }).catch(function(){}); break;
    case 'koreksi':
      var bn = S.stok.bahan.filter(function(x){ return x.kode === el.dataset.k; })[0];
      $('#modal').innerHTML = '<div class="mbg" data-act="closeModalBg"><div class="modal"><h2>Koreksi stok</h2><p class="muted" style="margin-top:4px">' + esc(bn.nama) + ', tercatat ' + R(bn.stok) + ' ' + esc(bn.satuan) + '.</p>' +
        '<label class="lbl" for="kr-val">Stok sebenarnya setelah dihitung (' + esc(bn.satuan) + ')</label><input class="inp money" id="kr-val" inputmode="decimal" value="' + bn.stok + '">' +
        '<div class="mact" style="margin-top:16px"><button class="btn ghost" data-act="closeModal">Batal</button><button class="btn blue" data-act="koreksiOk" data-k="' + esc(bn.kode) + '">' + I.check + 'Simpan koreksi</button></div></div></div>';
      break;
    case 'koreksiOk':
      call('koreksiStok', el.dataset.k, Number(String($('#kr-val').value).replace(',', '.')), 'Hitung ulang').then(function(r){ closeModal(); S.stok = r; renderStok(); toast('Stok dikoreksi'); }).catch(function(){});
      break;
  }
});
var lastWide = window.innerWidth >= 960;
window.addEventListener('resize', function(){
  var wide = window.innerWidth >= 960;
  if (wide !== lastWide) { lastWide = wide; if (S.tab === 'antre' && S.antre) renderAntre(); }
  clearTimeout(window._rz); window._rz = setTimeout(function(){ if (S.tab === 'dash') drawCharts(); }, 120);
});

/* ---------- mulai ---------- */
S.token = IS_GAS ? load('kasir_tok') : null;
api('publicUsers').then(function(u){
  S.users = u;
  if (S.token) boot().catch(function(){ S.token = null; renderLogin(); });
  else renderLogin();
}, function(e){ $('#root').innerHTML = '<div class="card" style="margin:20px">Gagal memuat: ' + esc(e.message) + '</div>'; });
})();
</script>
